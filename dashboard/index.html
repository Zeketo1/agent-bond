<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentBond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>AgentBond</h1>
      <p class="tagline">An agent can only spend what a human has put at stake for it.</p>
    </div>
    <form id="watch" class="watch" autocomplete="off">
      <label for="contract">Contract on testnet</label>
      <div class="watch-row">
        <input id="contract" name="contract" spellcheck="false" placeholder="bond-1234.testnet">
        <button type="submit">Watch</button>
      </div>
      <p id="live" class="live" role="status"></p>
      <p class="hint">Opens on the demo contract. Type any AgentBond contract to watch it. This page only reads from testnet.</p>
    </form>
  </header>
  <main id="app"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
